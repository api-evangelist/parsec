aid: parsec
name: Parsec
description: >-
  Parsec is a high-performance, low-latency remote desktop and interactive video
  streaming product, now a Unity company, used to access graphics-intensive and
  latency-sensitive applications from anywhere across any device. Its
  peer-to-peer architecture streams in silky-smooth high definition and is used
  by game studios (EA, Ubisoft, Blizzard, Square Enix), film/TV, animation,
  broadcast and architecture teams. Parsec for Teams adds organization-wide
  administration, and the Parsec for Teams API exposes that admin surface —
  managing members, groups, team machines (computers), time-limited guest
  access, application rules, relays, and the team audit log — authenticated with
  an API key presented as an HTTP Bearer token and governed by a granular team
  permission model.
